[platformio]
default_envs = ipspro_monitor
core_dir = .platformio

[env:ipspro_monitor]
platform = espressif32@6.5.0
board = pico32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.0.3
    adafruit/Adafruit NeoPixel@1.12.0
build_flags =
    -D USER_SETUP_LOADED
    -D ST7789_DRIVER
    -D CGRAM_OFFSET
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=25
    -D TFT_RST=26
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D SMOOTH_FONT
